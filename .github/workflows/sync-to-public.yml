name: Sync to Public

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'sigpanic/goink-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push 30-day-old commit to public
        run: |
          TARGET=$(git log --before='30 days ago' --format='%H' -1 master)
          if [ -z "$TARGET" ]; then
            echo "No commit older than 30 days on master"
            exit 0
          fi
          git push https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/sigpanic/goink.git $TARGET:refs/heads/master
