name: Sync to Public

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'sigpanic/goink-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push 30-day-old commit to public
        env:
          PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          PUBLIC_URL="https://x-access-token:${PAT}@github.com/sigpanic/goink.git"
          TARGET=$(git log --before='30 days ago' --format='%H' -1 master)
          if [ -z "$TARGET" ]; then
            echo "No commit older than 30 days on master"
            exit 0
          fi
          PUBLIC_HEAD=$(git ls-remote "$PUBLIC_URL" refs/heads/master | cut -f1)
          if git merge-base --is-ancestor "$TARGET" "$PUBLIC_HEAD"; then
            echo "Commit $TARGET already in public master — skipping"
            exit 0
          fi
          git push "$PUBLIC_URL" $TARGET:refs/heads/master
